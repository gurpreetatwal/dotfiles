name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Run shellcheck
        run: shellcheck --exclude=SC1090,SC1091 del/del del/test "install/run-helper" "install/helpers.sh" shell/aliases shell/commonrc shell/functions shell/profile

  del:
    name: del
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install gomi
        run: |
          mkdir -p "$HOME/bin"
          make gomi
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Make a spare volume
        run: |
          truncate -s 64M "$RUNNER_TEMP/volume.img"
          mkfs.ext4 -q "$RUNNER_TEMP/volume.img"
          sudo mkdir /mnt/del-volume
          sudo mount -o loop "$RUNNER_TEMP/volume.img" /mnt/del-volume
          sudo chown "$(id -u):$(id -g)" /mnt/del-volume
          echo "DEL_TEST_VOLUME=/mnt/del-volume" >> "$GITHUB_ENV"

      - name: Run tests
        run: del/test
