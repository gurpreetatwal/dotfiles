core:
  trash:
    # A single pinned store rather than the XDG trash: one place to look, and
    # the same layout on Linux and macOS. Variables are expanded by gomi, so
    # this resolves per-machine.
    strategy: legacy
    gomi_dir: $XDG_DATA_HOME/gomi

    # Protected subtrees: nothing at or below these may be deleted. gomi
    # enforces this for direct calls and del reads the same list. Directories
    # that only need protecting by name, such as $HOME, whose contents are fair
    # game, are not listed here, because gomi would refuse everything under them.
    forbidden_paths:
      - /bin
      - /boot
      - /etc
      - /lib
      - /lib32
      - /lib64
      - /proc
      - /root
      - /run
      - /sbin
      - /srv
      - /sys
      - /usr
      - /var
      - /Applications
      - /Library
      - /System
      - $HOME/.ssh
      - $HOME/.gnupg
      - $HOME/dotfiles
      - $XDG_DATA_HOME/gomi
      - $XDG_DATA_HOME/Trash

  restore:
    confirm: true
    verbose: true

  # `del --permanent` covers this, and it is one keypress away in the restore
  # browser otherwise.
  permanent_delete:
    enable: false
