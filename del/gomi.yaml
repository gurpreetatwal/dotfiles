core:
  trash:
    # The XDG trash, which has one trash per volume: a file is renamed into the
    # trash on its own filesystem instead of being copied to another one.
    strategy: xdg

    # When a file's volume has no trash, refuse instead of copying it into the
    # home trash. del checks this before it asks for confirmation.
    home_fallback: false

    # Protected subtrees: nothing at or below these may be deleted. gomi
    # enforces this for direct calls and del reads the same list. Directories
    # that only need protecting by name, such as $HOME, whose contents are fair
    # game, are not listed here, because gomi would refuse everything under them.
    forbidden_paths:
      - /bin
      - /boot
      - /etc
      - /lib
      - /lib32
      - /lib64
      - /proc
      - /root
      - /run
      - /sbin
      - /srv
      - /sys
      - /usr
      - /var
      - /Applications
      - /Library
      - /System
      - $HOME/.ssh
      - $HOME/.gnupg
      - $HOME/dotfiles
      - $XDG_DATA_HOME/gomi
      - $XDG_DATA_HOME/Trash

  restore:
    confirm: true
    verbose: true

  # `del --permanent` covers this, and it is one keypress away in the restore
  # browser otherwise.
  permanent_delete:
    enable: false
